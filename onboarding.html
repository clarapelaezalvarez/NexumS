<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nexum Social · Onboarding</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#f0f4f8 0%,#e2e8f2 100%);min-height:100vh;padding:20px;}
        .onboarding-container{max-width:800px;margin:0 auto;}
        .logo-area{text-align:center;margin-bottom:32px;}
        .logo-icon{width:70px;height:70px;background:linear-gradient(135deg,#2c5f8a,#5b8c5a);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:36px;color:white;margin-bottom:12px;}
        .logo-text{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#2c5f8a,#5b8c5a);background-clip:text;-webkit-background-clip:text;color:transparent;}
        .card{background:white;border-radius:32px;padding:32px;box-shadow:0 12px 28px rgba(0,0,0,0.08);}
        .intro-text{text-align:center;margin-bottom:32px;}
        .intro-text p{color:#4a6272;line-height:1.6;margin-bottom:20px;font-size:1rem;}
        .intro-text h2{color:#1f4e6e;margin-bottom:16px;}
        .highlight{background:linear-gradient(120deg,#e8f0fe 0%,#d4e4f7 100%);padding:20px;border-radius:20px;margin:24px 0;border-left:4px solid #e67e22;}
        .btn-start{background:linear-gradient(135deg,#2c5f8a,#5b8c5a);color:white;border:none;padding:14px 32px;border-radius:60px;font-weight:700;font-size:1.1rem;cursor:pointer;transition:all 0.3s;margin-top:16px;}
        .btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(44,95,138,0.3);}
        .progress-bar-container{background:#e2e8f0;border-radius:40px;height:8px;margin:24px 0;overflow:hidden;}
        .progress-bar{background:linear-gradient(90deg,#2c5f8a,#5b8c5a);width:0%;height:100%;transition:width 0.3s ease;}
        .step-indicator{display:flex;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:8px;}
        .step{flex:1;text-align:center;padding:8px;background:#f1f5f9;border-radius:40px;font-size:0.7rem;font-weight:600;color:#94a3b8;transition:all 0.3s;}
        .step.active{background:#2c5f8a;color:white;}
        .step.completed{background:#5b8c5a;color:white;}
        .form-group{margin-bottom:24px;}
        label{font-weight:600;display:block;margin-bottom:8px;color:#2c5f8a;font-size:0.9rem;}
        .required{color:#e67e22;}
        input,select,textarea{width:100%;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:20px;font-family:inherit;font-size:0.95rem;transition:all 0.2s;}
        input:focus,select:focus,textarea:focus{outline:none;border-color:#5b8c5a;box-shadow:0 0 0 3px rgba(91,140,90,0.1);}
        .row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
        .examples{font-size:0.75rem;color:#5a6e7a;margin-top:6px;background:#f8fafc;padding:8px 12px;border-radius:12px;}
        .examples strong{color:#2c5f8a;}
        .btn-group{display:flex;gap:12px;justify-content:space-between;margin-top:32px;}
        .btn-primary{background:#5b8c5a;color:white;border:none;padding:14px 28px;border-radius:40px;font-weight:600;cursor:pointer;font-size:1rem;transition:background 0.2s;}
        .btn-primary:hover{background:#4a7350;}
        .btn-primary:disabled{background:#cbd5e1;cursor:not-allowed;}
        .btn-secondary{background:#cbd5e1;color:#1a2c3e;border:none;padding:14px 28px;border-radius:40px;font-weight:600;cursor:pointer;font-size:1rem;transition:background 0.2s;}
        .terms-box{background:#f8fafc;border-radius:16px;padding:16px;margin:16px 0;}
        .error-message{color:#e67e22;font-size:0.8rem;margin-top:4px;}
        .hidden{display:none;}
    </style>
</head>
<body>
<div class="onboarding-container" id="onboardingContainer">
    <div class="logo-area"><div class="logo-icon">⟳</div><div class="logo-text">Nexum Social</div></div>
    <div class="card" id="dynamicContent"></div>
</div>
<script>
let etapaAtual="intro", currentStep=0;
const totalSteps=5;
let userData={email:"",senha:"",nome:"",dataNascimento:"",dataNascimentoOriginal:"",idade:0,localidade:"",areaAtuacao:"",faseAtual:"",religiao:"",posicaoPolitica:"",timeFutebol:"",valores:"",gostosTexto:"",aprenderTexto:"",crencasTransformacao:"",duvidasAbertas:"",experienciasVirada:"",concordaMonitoramento:false,concordaRegras:false};
function validarEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}
function validarSenha(s){return s.length>=6;}
function validarDataNascimento(d){const r=/^(\d{2})\/(\d{2})\/(\d{4})$/;if(!r.test(d))return{valido:false,mensagem:"Formato inválido"};let dia=parseInt(RegExp.$1,10),mes=parseInt(RegExp.$2,10),ano=parseInt(RegExp.$3,10);if(ano<1900||ano>new Date().getFullYear())return{valido:false,mensagem:"Ano inválido"};if(mes<1||mes>12)return{valido:false,mensagem:"Mês inválido"};let dp=[31,28,31,30,31,30,31,31,30,31,30,31];if((ano%400===0)||(ano%4===0&&ano%100!==0))dp[1]=29;if(dia<1||dia>dp[mes-1])return{valido:false,mensagem:"Dia inválido"};const hoje=new Date();let idade=hoje.getFullYear()-ano;const mesDiff=hoje.getMonth()-(mes-1);if(mesDiff<0||(mesDiff===0&&hoje.getDate()<dia))idade--;if(idade<18)return{valido:false,mensagem:`❌ Infelizmente você tem ${idade} anos. O Nexum Social é uma plataforma para maiores de 18 anos. Quando completar 18 anos, volte! 💙`};return{valido:true,idade,dataObj:new Date(ano,mes-1,dia)};}
function formatarDataInput(i){let v=i.value.replace(/\D/g,'');if(v.length>2)v=v.substring(0,2)+'/'+v.substring(2);if(v.length>5)v=v.substring(0,5)+'/'+v.substring(5,9);i.value=v;}
function renderizarIntro(){const c=document.getElementById("dynamicContent");c.innerHTML=`<div class="intro-text"><h2>🌱 Bem-vindo ao Nexum Social</h2><p>O Nexum é uma rede para <strong>conexões com propósito</strong>.</p><p>Aqui, você não segue apenas conteúdo --- você se conecta com <strong>pessoas, ideias e projetos</strong> que realmente fazem sentido para você.</p><div class="highlight"><p>🎮 <strong>AQUI É VOCÊ QUE CONTROLA O ALGORITMO, NÃO O CONTRÁRIO!</strong> 🎮</p><p style="font-size: 0.9rem; margin-top: 8px;">Diferente de outras redes, você decide como quer se conectar, com quem e por quê. O algoritmo trabalha PARA você, não contra você.</p></div><p>Você também pode <strong>sair da sua bolha de crenças</strong> e se conectar com pessoas que pensam e vivem de forma muito diferente de você. Desta forma, nós <strong>regeneramos o tecido social</strong> que está muito desgastado.</p><p>Para isso funcionar, precisamos entender um pouco sobre você. Isso é fundamental e diferente.</p><p style="color: #e67e22; font-weight: 600;">Leva menos de 3 minutos. Mas sua acuidade nas respostas é o que vai fazer a diferença.</p><button class="btn-start" id="startBtn">✨ Começar</button></div>`;document.getElementById("startBtn").onclick=()=>{etapaAtual="cadastro";renderizarCadastro();};}
function renderizarCadastro(){const c=document.getElementById("dynamicContent");c.innerHTML=`<div style="text-align:center; margin-bottom:24px;"><h2 style="color:#1f4e6e;">🔐 Crie sua conta</h2><p style="color:#4a6272; margin-top:8px;">Seu e-mail e senha serão usados para acessar o Nexum Social</p></div><div class="form-group"><label>📧 E-mail <span class="required">*</span></label><input type="email" id="emailCadastro" placeholder="seu@email.com" autocomplete="off"><div id="emailError" class="error-message"></div></div><div class="form-group"><label>🔒 Senha <span class="required">*</span></label><input type="password" id="senhaCadastro" placeholder="Mínimo 6 caracteres"><div id="senhaError" class="error-message"></div></div><div class="form-group"><label>🔒 Confirmar senha <span class="required">*</span></label><input type="password" id="confirmarSenha" placeholder="Digite a senha novamente"><div id="confirmarError" class="error-message"></div></div><div class="btn-group"><button class="btn-secondary" id="backToIntroBtn">← Voltar</button><button class="btn-primary" id="proceedToProfileBtn">Continuar →</button></div>`;const e=document.getElementById("emailCadastro"),s=document.getElementById("senhaCadastro"),c2=document.getElementById("confirmarSenha"),p=document.getElementById("proceedToProfileBtn"),b=document.getElementById("backToIntroBtn");function v(){let ok=true,mail=e.value.trim();if(!validarEmail(mail)){document.getElementById("emailError").innerHTML="❌ Digite um e-mail válido (ex: nome@dominio.com)";ok=false;}else document.getElementById("emailError").innerHTML="";let sen=s.value;if(!validarSenha(sen)){document.getElementById("senhaError").innerHTML="❌ A senha deve ter pelo menos 6 caracteres";ok=false;}else document.getElementById("senhaError").innerHTML="";if(sen!==c2.value){document.getElementById("confirmarError").innerHTML="❌ As senhas não coincidem";ok=false;}else document.getElementById("confirmarError").innerHTML="";p.disabled=!ok;}e.oninput=v;s.oninput=v;c2.oninput=v;v();p.onclick=()=>{if(p.disabled)return;userData.email=e.value.trim();userData.senha=s.value;etapaAtual="formulario";renderizarFormulario();};b.onclick=()=>{etapaAtual="intro";renderizarIntro();};p.disabled=true;}
function renderizarFormulario(){const c=document.getElementById("dynamicContent");c.innerHTML=`<div class="progress-bar-container"><div class="progress-bar" id="progressBar" style="width:0%;"></div></div><div class="step-indicator" id="stepIndicator"><div class="step active" data-step="0">1. Identidade</div><div class="step" data-step="1">2. Perfil</div><div class="step" data-step="2">3. Visões</div><div class="step" data-step="3">4. Interiores</div><div class="step" data-step="4">5. Regras</div></div><div id="stepContainer"></div>`;renderStep(0);}
function renderStep(s){const sc=document.getElementById("stepContainer");if(!sc)return;const stepsHtml=[
`<div id="stepContent"><h3 style="margin-bottom:24px;color:#1f4e6e;">✨ Quem é você?</h3><div class="form-group"><label>Nome completo <span class="required">*</span></label><input type="text" id="nome" placeholder="Ex: Ana Maria Silva"></div><div class="row-2"><div class="form-group"><label>Data de Nascimento <span class="required">*</span></label><input type="text" id="dataNascimento" placeholder="DD/MM/AAAA" maxlength="10"><div id="dataNascimentoError" class="error-message"></div></div><div class="form-group"><label>Idade</label><input type="text" id="idadeDisplay" readonly placeholder="Será calculada" style="background:#f1f5f9;"></div></div><div class="form-group"><label>📍 Cidade, Estado, País onde reside <span class="required">*</span></label><input type="text" id="localidade" placeholder="Ex: São Paulo, SP, Brasil"></div><div class="form-group"><label>📌 Área de atuação profissional</label><input type="text" id="areaAtuacao" placeholder="Ex: Tecnologia, Educação, Saúde, Artes..."><div class="examples"><strong>💡 Exemplos:</strong> Tecnologia, Educação, Psicologia, Engenharia, Arquitetura, Comunicação, Marketing, Direito, Saúde, Artes, Administração, Comércio, Construção Civil, Design, RH, Vendas, Música, Fotografia, Gastronomia...</div></div><div class="form-group"><label>🎯 Fase atual da carreira</label><select id="faseAtual"><option value="">Selecione uma opção</option><option value="Estudante">📚 Estudante</option><option value="Início de carreira">🌱 Início de carreira</option><option value="Profissional experiente">💼 Profissional experiente</option><option value="Empreendedor">🚀 Empreendedor</option><option value="Em transição">🔄 Em transição</option><option value="Aposentado / mentor">👴 Aposentado / mentor</option><option value="Prefiro não informar">🙈 Prefiro não informar</option></select></div></div>`,
`<div id="stepContent"><h3 style="margin-bottom:24px;color:#1f4e6e;">📝 Seu Perfil</h3><div class="form-group"><label>🙏 Religião / Espiritualidade</label><input type="text" id="religiao" placeholder="Digite sua crença religiosa ou espiritualidade"><div class="examples"><strong>💡 Exemplos:</strong> Católica, Evangélica, Espírita, Budista, Judaica, Islâmica, Candomblé, Umbanda, Ateu/Agnóstica (sem religião), Espiritualista, Deísta, Hinduísta, Xintoísta, Sikhismo, Wicca, Neopaganismo, Não tenho religião, Agnóstico... </div></div><div class="form-group"><label>🗳️ Posição política</label><input type="text" id="posicaoPolitica" placeholder="Digite sua visão política"><div class="examples"><strong>💡 Exemplos:</strong> Extrema-esquerda, Esquerda, Centro-esquerda, Centro, Centro-direita, Direita, Extrema-direita, Apolítico (não me interesso), Libertário, Anarquista, Social-democrata, Liberal, Conservador, Socialista, Comunista, Ecológico, Nacionalista, Prefiro não me posicionar, Não gosto de política...</div></div><div class="form-group"><label>⚽ Time de futebol favorito</label><input type="text" id="timeFutebol" placeholder="Digite seu time do coração"><div class="examples"><strong>💡 Exemplos:</strong> Flamengo, Corinthians, Palmeiras, São Paulo, Santos, Grêmio, Internacional, Cruzeiro, Vasco, Fluminense, Atlético-MG, Bahia, Sport, Fortaleza, Não torço para nenhum, Não gosto de futebol, Prefiro outros esportes...</div></div><div class="form-group"><label>⭐ Valores fundamentais</label><input type="text" id="valores" placeholder="Digite os valores mais importantes para você"><div class="examples"><strong>💡 Exemplos:</strong> Honestidade, Empatia, Respeito, Justiça, Solidariedade, Liberdade, Igualdade, Sustentabilidade, Paz, Tolerância, Família, Amizade, Conhecimento, Criatividade, Inovação, Tradição, Coragem, Humildade, Gratidão, Lealdade, Compaixão... (escreva pelo menos 3 valores)</div></div></div>`,
`<div id="stepContent"><h3 style="margin-bottom:24px;color:#1f4e6e;">💛 O que te move?</h3><div class="form-group"><label>💛 Coisas que você gosta muito de fazer</label><textarea rows="4" id="gostosTexto" placeholder="Escreva suas paixões e hobbies..."></textarea><div class="examples"><strong>💡 Exemplos:</strong> Viajar para lugares pouco explorados, ler ficção científica e filosofia, praticar meditação mindfulness, cozinhar pratos vegetarianos, tocar violão, fotografar paisagens, dançar salsa, correr ao ar livre, fazer trilhas, acampar, assistir cinema de arte, jogar videogames, praticar yoga, fazer jardinagem, escrever poesias, pintar quadros, fazer artesanato, cuidar de animais domésticos, fazer voluntariado, participar de rodas de conversa, aprender novos idiomas...</div></div><div class="form-group"><label>📖 Coisas que você gostaria de aprender</label><textarea rows="4" id="aprenderTexto" placeholder="O que você tem vontade de aprender?"></textarea><div class="examples"><strong>💡 Exemplos:</strong> Programação em Python, falar italiano fluentemente, tocar piano, praticar Reiki, fazer marcenaria criativa, cultivar plantas medicinais, aprender técnicas de mediação de conflitos, estudar astrofísica, fazer curso de culinária vegana, aprender dança de salão, praticar escalada esportiva, meditar por mais tempo, fazer um intercâmbio cultural, aprender libras, estudar inteligência emocional...</div></div></div>`,
`<div id="stepContent"><h3 style="margin-bottom:24px;color:#1f4e6e;">🧭 Mapa Interior</h3><div class="form-group"><label>🔄 Crenças em transformação ("estou repensando...")</label><textarea rows="3" id="crencasTransformacao" placeholder="O que você tem questionado ou revisto ultimamente?"></textarea><div class="examples"><strong>💡 Exemplos:</strong> Estou repensando minha relação com o dinheiro e o trabalho, estou questionando minha fé e espiritualidade, estou repensando minha carreira profissional, estou revendo minha posição política diante dos desafios climáticos, estou repensando o modelo de família tradicional, estou questionando o consumismo desenfreado, estou revendo minha relação com as redes sociais, estou repensando o que realmente me faz feliz...</div></div><div class="form-group"><label>❓ Dúvidas abertas ("quero entender melhor sobre...")</label><textarea rows="3" id="duvidasAbertas" placeholder="Quais perguntas te habitam? O que você está curioso para descobrir?"></textarea><div class="examples"><strong>💡 Exemplos:</strong> Como construir comunidades mais resilientes em grandes centros urbanos? Até que ponto a tecnologia aproxima ou afasta as pessoas? Como equilibrar vida digital e vida presencial? O que realmente importa no final da vida? Como lidar com conflitos de forma construtiva? Como encontrar propósito no trabalho? Qual o sentido da vida? Como ser mais feliz com menos?</div></div><div class="form-group"><label>⚡ Experiências de virada (transições de vida)</label><textarea rows="3" id="experienciasVirada" placeholder="Compartilhe momentos que mudaram sua forma de ver o mundo"></textarea><div class="examples"><strong>💡 Exemplos:</strong> Uma viagem de mochilão pela América do Sul que transformou minha visão sobre simplicidade, a perda de um ente querido que me ensinou sobre o valor do tempo, uma mudança de país que me fez repensar identidade, uma doença que me ensinou sobre resiliência, o nascimento de um filho que mudou minhas prioridades, a transição de carreira aos 40 anos, um divórcio que me fez reconectar comigo mesmo, uma experiência de quase-morte, um acidente que me ensinou sobre solidariedade...</div></div></div>`,
`<div id="stepContent"><h3 style="margin-bottom:24px;color:#1f4e6e;">📜 Regras e Compromissos</h3><div class="terms-box"><label style="display:flex; align-items:center; gap:12px; cursor:pointer;"><input type="checkbox" id="concordaMonitoramento"><span>✅ Eu concordo que o sistema monitore minhas conversas em tempo real e intervenha se necessário para mediação de conflitos</span></label><div style="font-size:0.75rem; color:#5a6e7a; margin-top:8px; margin-left:28px;">O sistema NÃO armazena as conversas permanentemente. A atuação é apenas em tempo real e tem o intuito de ajudar a resolver conflitos através de mediação.</div></div><div class="terms-box"><label style="display:flex; align-items:center; gap:12px; cursor:pointer;"><input type="checkbox" id="concordaRegras"><span>✅ Eu concordo com as regras de funcionamento da plataforma</span></label><div style="font-size:0.75rem; color:#5a6e7a; margin-top:8px; margin-left:28px;">• Não usar palavras de baixo calão<br>• Tratar todos com respeito, não importa o quão diferentes sejam<br>• A plataforma pode expulsar pessoas que romperem qualquer regra mais de 3 vezes</div></div></div>`
];sc.innerHTML=stepsHtml[s]+`<div class="btn-group">${s>0?'<button class="btn-secondary" id="prevBtn">← Voltar</button>':''}<button class="btn-primary" id="nextBtn">${s===4?'Finalizar':'Próximo →'}</button></div>`;document.getElementById("nextBtn").onclick=()=>nextStepForm();if(document.getElementById("prevBtn"))document.getElementById("prevBtn").onclick=()=>prevStepForm();if(s===0){const di=document.getElementById("dataNascimento");if(di){di.addEventListener("input",function(){formatarDataInput(this);validarDataNascimentoInput();});di.addEventListener("blur",function(){validarDataNascimentoInput();});}["nome","localidade"].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>validarPasso0();});document.getElementById("areaAtuacao").oninput=()=>validarPasso0();document.getElementById("faseAtual").onchange=()=>validarPasso0();validarPasso0();}if(s===1){["religiao","posicaoPolitica","timeFutebol","valores"].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>validarPasso1();});validarPasso1();}if(s===2){["gostosTexto","aprenderTexto"].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>validarPasso2();});validarPasso2();}if(s===3){["crencasTransformacao","duvidasAbertas","experienciasVirada"].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>validarPasso3();});validarPasso3();}if(s===4){const c1=document.getElementById("concordaMonitoramento"),c2=document.getElementById("concordaRegras");if(c1)c1.onchange=()=>validarPasso4();if(c2)c2.onchange=()=>validarPasso4();validarPasso4();}updateProgress();}
let dataValidada=false,idadeCalculada=0;
function validarDataNascimentoInput(){const di=document.getElementById("dataNascimento"),err=document.getElementById("dataNascimentoError"),idDisplay=document.getElementById("idadeDisplay"),ds=di.value;if(!ds){err.innerHTML="";idDisplay.value="";dataValidada=false;validarPasso0();return;}const v=validarDataNascimento(ds);if(!v.valido){err.innerHTML=v.mensagem;idDisplay.value="";dataValidada=false;if(v.mensagem.includes("menor de 18")){const nb=document.getElementById("nextBtn");if(nb)nb.disabled=true;}}else{err.innerHTML="";idDisplay.value=v.idade+" anos";idadeCalculada=v.idade;dataValidada=true;userData.idade=v.idade;userData.dataNascimentoOriginal=ds;userData.dataNascimento=v.dataObj.toISOString();}validarPasso0();}
function validarPasso0(){const n=document.getElementById("nome")?.value.trim(),l=document.getElementById("localidade")?.value.trim(),nb=document.getElementById("nextBtn");if(nb)nb.disabled=!(n&&l&&dataValidada);}
function validarPasso1(){const r=document.getElementById("religiao")?.value.trim(),p=document.getElementById("posicaoPolitica")?.value.trim(),t=document.getElementById("timeFutebol")?.value.trim(),v=document.getElementById("valores")?.value.trim(),nb=document.getElementById("nextBtn");if(nb)nb.disabled=!(r&&p&&t&&v);}
function validarPasso2(){const g=document.getElementById("gostosTexto")?.value.trim(),a=document.getElementById("aprenderTexto")?.value.trim(),nb=document.getElementById("nextBtn");if(nb)nb.disabled=!(g&&a);}
function validarPasso3(){const c=document.getElementById("crencasTransformacao")?.value.trim(),d=document.getElementById("duvidasAbertas")?.value.trim(),e=document.getElementById("experienciasVirada")?.value.trim(),nb=document.getElementById("nextBtn");if(nb)nb.disabled=!(c&&d&&e);}
function validarPasso4(){const c1=document.getElementById("concordaMonitoramento")?.checked,c2=document.getElementById("concordaRegras")?.checked,nb=document.getElementById("nextBtn");if(nb)nb.disabled=!(c1&&c2);}
function collectStepData(s){if(s===0){userData.nome=document.getElementById("nome")?.value||"";userData.localidade=document.getElementById("localidade")?.value||"";userData.areaAtuacao=document.getElementById("areaAtuacao")?.value||"";userData.faseAtual=document.getElementById("faseAtual")?.value||"";}else if(s===1){userData.religiao=document.getElementById("religiao")?.value||"";userData.posicaoPolitica=document.getElementById("posicaoPolitica")?.value||"";userData.timeFutebol=document.getElementById("timeFutebol")?.value||"";userData.valores=document.getElementById("valores")?.value||"";}else if(s===2){userData.gostosTexto=document.getElementById("gostosTexto")?.value||"";userData.aprenderTexto=document.getElementById("aprenderTexto")?.value||"";}else if(s===3){userData.crencasTransformacao=document.getElementById("crencasTransformacao")?.value||"";userData.duvidasAbertas=document.getElementById("duvidasAbertas")?.value||"";userData.experienciasVirada=document.getElementById("experienciasVirada")?.value||"";}else if(s===4){userData.concordaMonitoramento=document.getElementById("concordaMonitoramento")?.checked||false;userData.concordaRegras=document.getElementById("concordaRegras")?.checked||false;}}
function nextStepForm(){collectStepData(currentStep);if(currentStep===0){if(!userData.nome){alert("Digite seu nome");return;}if(!dataValidada){alert("Informe uma data de nascimento válida (DD/MM/AAAA)");return;}if(!userData.localidade){alert("Informe sua localidade");return;}}else if(currentStep===1){if(!userData.religiao){alert("Informe sua religião ou espiritualidade");return;}if(!userData.posicaoPolitica){alert("Informe sua posição política");return;}if(!userData.timeFutebol){alert("Informe seu time de futebol (ou que não torce)");return;}if(!userData.valores){alert("Informe seus valores fundamentais");return;}}else if(currentStep===2){if(!userData.gostosTexto){alert("Conte-nos o que você gosta de fazer");return;}if(!userData.aprenderTexto){alert("Conte-nos o que você gostaria de aprender");return;}}else if(currentStep===3){if(!userData.crencasTransformacao){alert("Compartilhe suas crenças em transformação");return;}if(!userData.duvidasAbertas){alert("Compartilhe suas dúvidas abertas");return;}if(!userData.experienciasVirada){alert("Compartilhe suas experiências de virada");return;}}else if(currentStep===4){if(!userData.concordaMonitoramento||!userData.concordaRegras){alert("Você precisa aceitar os termos");return;}}if(currentStep<totalSteps-1){currentStep++;renderStep(currentStep);}else{finalizarOnboarding();}}
function prevStepForm(){if(currentStep>0){collectStepData(currentStep);currentStep--;renderStep(currentStep);}}
function updateProgress(){const progress=((currentStep+1)/totalSteps)*100;const pb=document.getElementById("progressBar");if(pb)pb.style.width=progress+"%";const steps=document.querySelectorAll(".step");steps.forEach((step,idx)=>{step.classList.remove("active","completed");if(idx<currentStep)step.classList.add("completed");if(idx===currentStep)step.classList.add("active");});}
function finalizarOnboarding(){collectStepData(4);const usuarios=JSON.parse(localStorage.getItem("nexumUsuarios")||"[]");if(usuarios.find(u=>u.email===userData.email)){alert("❌ Este e-mail já está cadastrado. Tente fazer login.");return;}const perfil={email:userData.email,senha:userData.senha,nome:userData.nome,dataNascimento:userData.dataNascimento,dataNascimentoOriginal:userData.dataNascimentoOriginal,idade:idadeCalculada,localidade:userData.localidade,areaAtuacao:userData.areaAtuacao,faseAtual:userData.faseAtual,religiao:userData.religiao,posicaoPolitica:userData.posicaoPolitica,timeFutebol:userData.timeFutebol,valores:userData.valores,gostosTexto:userData.gostosTexto,aprenderTexto:userData.aprenderTexto,crencasTransformacao:userData.crencasTransformacao,duvidasAbertas:userData.duvidasAbertas,experienciasVirada:userData.experienciasVirada,arquetipo:"Fantasma",reputacao:5.0,conexoesTotal:0,mediaReciprocidade:0.0,diversidadeCognitiva:0.0,pontosCegos:0,diferencasIrreconciliaveis:0,diferencasResolvidas:0,conexoesAtivas:[],conversasRealizadas:[],mediacoesRealizadas:0,mediacoesSucedidas:0,concordaMonitoramento:userData.concordaMonitoramento,concordaRegras:userData.concordaRegras,id:Date.now(),dataCadastro:new Date().toISOString()};usuarios.push({email:userData.email,senha:userData.senha,userId:perfil.id});localStorage.setItem("nexumUsuarios",JSON.stringify(usuarios));localStorage.setItem("nexumUserProfile",JSON.stringify(perfil));alert(`✨✨✨ PARABÉNS, ${userData.nome}! ✨✨✨\n\n🎭 Seu arquétipo é: FANTASMA\n\n👻 Como Fantasma, você está no início da sua jornada relacional. Cada nova conexão é um passo para sair da invisibilidade!\n\n📊 Todas as suas estatísticas começam zeradas:\n• Conexões: 0\n• Reciprocidade: 0\n• Diversidade Cognitiva: 0\n• Reputação: 5.0 (neutro)\n\n🎮 LEMBRE-SE: Aqui é VOCÊ que controla o algoritmo, não o contrário!\n\nAgora você será direcionado para o dashboard.`);window.parent.postMessage("onboardingConcluido","*");}
renderizarIntro();
